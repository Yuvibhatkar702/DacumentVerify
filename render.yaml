services:
  - type: web
    name: docverify-api
    env: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PYTHON_SERVICE_URL
        value: http://docverify-python:8000
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_PATH
        value: ./uploads
      - key: DOCUMENT_RETENTION_HOURS
        value: 24
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d

  - type: web
    name: docverify-python
    env: docker
    rootDir: python_service
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health

  - type: web
    name: docverify-client
    env: static
    rootDir: client
    plan: starter
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
